name: android-apk

# Builds the admin app as an installable .apk on EAS and attaches it to the run.
# Manual only, so a push never spends EAS build credits by accident.
# Needs the repository secret EXPO_TOKEN (Expo account > Access tokens).

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile (both produce an .apk)
        type: choice
        options: [production, preview]
        default: production

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci

      - name: Build APK on EAS
        run: eas build --platform android --profile "${{ inputs.profile }}" --non-interactive --json > build.json

      - name: Download APK
        run: |
          url=$(jq -r '.[0].artifacts.buildUrl' build.json)
          test -n "$url" -a "$url" != null
          curl -fsSL "$url" -o thandra-admin.apk
          echo "EAS build page: $(jq -r '.[0].buildDetailsPageUrl' build.json)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: thandra-admin-apk
          path: thandra-admin.apk
          if-no-files-found: error
          retention-days: 30
